name: Deploy Supabase

# Applies new migrations and deploys the compile-xml Edge Function when supabase/ changes on main.
# Repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID.
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

# The deploy authenticates to Supabase with its own secrets; the GITHUB_TOKEN only checks out code.
permissions:
  contents: read

# One deploy at a time; a newer merge waits instead of pushing migrations in parallel.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs can pick any branch; only main may deploy to production with these secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      # Actions pinned to full commit SHAs (the job has production secrets); bump them deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Apply migrations
        run: supabase db push --yes

      - name: Deploy compile-xml
        run: supabase functions deploy compile-xml --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
