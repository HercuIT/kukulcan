name: Code Quality Checks

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format-check

      - name: Run unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Run Node tests (database, Edge Function, server, migration)
        run: npm run test:node
