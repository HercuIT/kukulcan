name: Code Quality & Unit Tests

on:
  pull_request:
    branches:
      - main

# Only checks out and tests the code; the GITHUB_TOKEN needs nothing more than read access.
permissions:
  contents: read

jobs:
  code-quality-unit-tests:
    name: Pull request checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      # The XML contract test loads the Express routes, which need server/'s own dependencies
      # (fast-xml-parser, axios, uuid).
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format-check

      # TypeScript over the JavaScript (checkJs, tsconfig.typecheck.json); needs server/'s
      # dependencies for the Express and axios types, installed above.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Run Node tests (database, Edge Function, server, migration)
        run: npm run test:node
