name: Claude Code Review

# Automatic code review by Claude on every non-draft pull request to main. Claude reads the diff,
# checks it against CLAUDE.md and posts inline comments plus one summary comment. It can't push.
# Setup (once): install the Claude GitHub app on the repo and add the CLAUDE_CODE_OAUTH_TOKEN
# secret (README → "Claude Code review").

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review, reopened]

# A new push to the same PR replaces a review still in progress.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait until they're ready; PRs from forks get no secrets, so they're skipped.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first: it is the source of truth for this
            repo's rules, and the review should hold the change to them. In particular check:

            1. Correctness: bugs, unhandled errors and edge cases, broken behaviour elsewhere.
            2. Security: secrets or credentials in code, RLS and RPC permission rules (error codes
               28000, 42501, P0002, P0001), input validation on the Express routes, anything that
               writes to the shared Supabase project.
            3. Supabase migrations: created with `npx supabase migration new`, never editing an
               applied migration, RLS enabled, writes only through security definer RPCs.
            4. Tests: positive, negative and edge scenarios for new code, and a matching
               docs/<TICKET>-testing.md.
            5. Repo conventions: user-facing strings in src/constants/uiStrings.js, colors as
               var(--kk-…) tokens, README.md/CLAUDE.md updated when behaviour they describe changes,
               Spanish/English kept as the surrounding code has it.

            Don't comment on formatting or lint-style issues (Prettier, ESLint and the typecheck
            run in CI), and don't repeat what CI already enforces. Prefer a few well-founded
            comments over many speculative ones; say how confident you are when unsure.

            Post one inline comment per specific issue on the line it concerns, and finish with a
            single top-level summary comment (what the PR does, the main risks, and whether
            anything blocks merging).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
